baseURL = 'https://homekitchenpicks.com/'
canonifyURLs = true
languageCode = 'en-us'
title = 'HomeKitchen Picks — Honest Reviews for Your Home'
theme = 'ananke'
buildFuture = true

[params]
  description = "Real home and kitchen product reviews. Find the best gear for your kitchen, coffee setup, and home essentials — tested and compared."
  ananke_social = true
  author = "HomeKitchen Picks Team"
  show_reading_time = true
  copyright = "HomeKitchen Picks"

  google_ads_id = "AW-XXXXXXXXX"
  google_ads_label = "REPLACE_WITH_REAL_LABEL"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[related]
  includeNewer = false
  threshold = 60
  toLower = true

  [[related.indices]]
    name = "keywords"
    weight = 70

  [[related.indices]]
    name = "tags"
    weight = 50

  [[related.indices]]
    name = "date"
    weight = 10

[params.ananke]
  [params.ananke.pages]
    show_date = true
    show_reading_time = true

[[menu.main]]
name = "Reviews"
url = "/reviews/"
weight = 5

[[menu.main]]
name = "How We Test"
url = "/how-we-test/"
weight = 8

[[menu.main]]
name = "About"
url = "/about/"
weight = 10

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 20

[[menu.main]]
name = "Privacy Policy"
url = "/privacy-policy/"
weight = 30
