<!-- Custom CSS -->
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">

<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{if .IsPage}}{{ .Summary | truncate 160 }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}{{ end }}">
<meta name="author" content="HomeKitchen Picks Team">
<meta name="affiliate-disclosure" content="This site earns commissions through affiliate programs including Awin. Our reviews are not influenced by affiliate relationships.">

<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .IsPage }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{if .IsPage}}{{ .Summary | truncate 200 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ with .Params.image -}}
<meta property="og:image" content="{{ . | absURL }}">
{{ else -}}
<meta property="og:image" content="{{ "/images/homekitchen-picks-social.svg" | absURL }}">
{{ end }}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsPage }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{if .IsPage}}{{ .Summary | truncate 200 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
{{ with .Params.image -}}
<meta name="twitter:image" content="{{ . | absURL }}">
{{ else -}}
<meta name="twitter:image" content="{{ "/images/homekitchen-picks-social.svg" | absURL }}">
{{ end }}

<!-- GEO: Speakable content identification -->
{{ if .IsPage }}
  {{ $speakableSections := slice "summary" "content" }}
  <meta property="speakable" content='{{ $speakableSections | jsonify }}'>
{{ end }}
