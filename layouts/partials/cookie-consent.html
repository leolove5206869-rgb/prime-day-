{{/* Cookie Consent Banner — GDPR / CCPA compliance */}}
{{/* Shows only if user hasn't made a choice yet */}}
<div id="cookie-consent" class="cookie-consent" role="dialog" aria-label="Cookie consent" hidden>
  <div class="cookie-consent-inner">
    <p class="cookie-consent-text">
      We use cookies for analytics, affiliate tracking, and personalized ads.
      Read our <a href="/privacy-policy/" class="cookie-consent-link">Privacy Policy</a> for details.
    </p>
    <div class="cookie-consent-actions">
      <button type="button" id="cookie-accept" class="cookie-btn cookie-btn--accept">Accept All</button>
      <button type="button" id="cookie-reject" class="cookie-btn cookie-btn--reject">Reject Non-Essential</button>
      <button type="button" id="cookie-dismiss" class="cookie-btn cookie-btn--dismiss" aria-label="Close">✕</button>
    </div>
  </div>
</div>
