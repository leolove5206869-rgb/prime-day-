<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ .Site.BaseURL }}#organization",
      "name": "{{ .Site.Title }}",
      "url": "{{ .Site.BaseURL }}",
      "description": "{{ .Site.Params.description }}",
      "foundingDate": "2026",
      "sameAs": [],
      "affiliation": {
        "@type": "Organization",
        "name": "Awin Affiliate Program"
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": "{{ .Site.Title }}",
      "publisher": {
        "@id": "{{ .Site.BaseURL }}#organization"
      },
      "inLanguage": "en-US",
      "description": "{{ .Site.Params.description }}"
    },
    {{- if and .IsPage (eq .Type "authors") }}
    {
      "@type": "Person",
      "@id": "{{ .Permalink }}#person",
      "name": "{{ .Title }}",
      "description": "{{ .Params.bio }}",
      "url": "{{ .Permalink }}",
      "knowsAbout": {{ .Params.expertise | jsonify }}
    },
    {{- end }}
    {{- if .IsPage }}
    {{- if eq .Type "review" }}
    {
      "@type": "Product",
      "@id": "{{ .Permalink }}#product",
      "name": "{{ .Title }}",
      "description": "{{ .Summary }}",
      "url": "{{ .Permalink }}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink }}"
      },
      "brand": {
        "@type": "Brand",
        "name": "{{ with .Params.brand }}{{ . }}{{ else }}Multiple{{ end }}"
      },
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "USD",
        "offerCount": "1",
        "availability": "https://schema.org/InStock",
        "itemCondition": "https://schema.org/NewCondition"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "{{ .Params.rating | default "4.0" }}",
        "bestRating": "5",
        "ratingCount": "1"
      },
      "review": {
        "@type": "Review",
        "reviewRating": {
          "@type": "Rating",
          "ratingValue": "{{ .Params.rating | default "4.0" }}",
          "bestRating": "5"
        },
        "author": {{ if .Params.author }}{
          "@id": "{{ .Site.BaseURL }}authors/{{ .Params.author | urlize }}/#person"
        }{{ else }}{
          "@type": "Person",
          "name": "{{ .Site.Params.author }}"
        }{{ end }}
      }
    },
    {{- end }}
    {
      "@type": "Article",
      "@id": "{{ .Permalink }}#article",
      "headline": "{{ .Title }}",
      "description": "{{ .Params.summary | default .Summary }}",
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
      "author": {{ if .Params.author }}{
        "@id": "{{ .Site.BaseURL }}authors/{{ .Params.author | urlize }}/#person"
      }{{ else }}{
        "@type": "Person",
        "name": "{{ .Site.Params.author }}",
        "url": "{{ .Site.BaseURL }}about/"
      }{{ end }},
      "publisher": {
        "@id": "{{ .Site.BaseURL }}#organization"
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink }}"
      },
      "wordCount": {{ .WordCount }},
      "inLanguage": "en-US",
      "speakable": {
        "@type": "SpeakableSpecification",
        "cssSelector": [".review-summary", ".review-summary-text"]
      }
    }
    {{- end }}
  ]
}
</script>
{{- if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ .Site.BaseURL }}"
    }
    {{- with .CurrentSection }}
    {{- $sectionTitle := .Title | default (.Section | humanize) }}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ $sectionTitle | jsonify | safeJS }},
      "item": "{{ .Permalink }}"
    }
    {{- end }}
    ,{
      "@type": "ListItem",
      "position": {{ if .CurrentSection }}3{{ else }}2{{ end }},
      "name": {{ .Title | jsonify | safeJS }},
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{- end }}

{{- if .IsNode }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "url": "{{ .Permalink }}",
  "name": "{{ .Title }}",
  "itemListElement": [
    {{- range $i, $page := .Pages }}
    {{- if $i }},{{ end }}
    {
      "@type": "ListItem",
      "position": {{ add $i 1 }},
      "url": "{{ $page.Permalink }}"
    }
    {{- end }}
  ]
}
</script>
{{- end }}

{{- if and .IsPage (eq .Type "review") }}
{{- $hasFAQ := false }}
{{- if in .RawContent "## FAQ" }}{{ $hasFAQ = true }}{{ end }}
{{- if $hasFAQ }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- $faqQA := split .RawContent "## FAQ" }}
    {{- if gt (len $faqQA) 1 }}
      {{- $faqContent := index $faqQA 1 }}
      {{- $questions := split $faqContent "**" }}
      {{- $count := 0 }}
      {{- range $q := $questions }}
        {{- $q = trim $q "\n " }}
        {{- if and $q (gt (len $q) 10) (not (in $q "---")) (not (in $q "&")) }}
          {{- $parts := split $q "**" }}
          {{- if gt (len $parts) 1 }}
            {{- $question := trim (index $parts 0) " \n" }}
            {{- $answer := "" }}
            {{- if gt (len $parts) 1 }}
              {{- $answer = trim (index $parts 1) " \n" }}
              {{- $answer = replace $answer "\n" " " }}
              {{- $answer = truncate 300 $answer }}
            {{- end }}
            {{- if and $question $answer (gt (len $question) 5) }}
              {{- if gt $count 0 }},{{ end }}
              {
                "@type": "Question",
                "name": "{{ $question | plainify }}",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "{{ $answer | plainify }}"
                }
              }
              {{- $count = add $count 1 }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  ]
}
</script>
{{- end }}
{{- end }}
